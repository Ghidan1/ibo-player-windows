name: Build Zaghlol Player EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ZaghlolPlayer.csproj

      - name: Build
        run: dotnet build ZaghlolPlayer.csproj -c Release --no-restore

      - name: Publish single-file EXE
        run: dotnet publish ZaghlolPlayer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "iscc" }
          & $iscc ZaghlolPlayer.iss

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ZaghlolPlayer-exe
          path: publish/ZaghlolPlayer.exe
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ZaghlolPlayer-installer
          path: installer/ZaghlolPlayer-Setup-2.0.3.exe
          if-no-files-found: error

      - name: Publish release v2.0.3
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.3
          name: Zaghlol Player v2.0.3
          body: |
            Zaghlol Player v2.0.3 for Windows — UI restyle to the approved mockup design:
            - Live TV: new top bar (logo + underline tabs + search/bell/profile icons), one sidebar with categories (violet active pill) and channels with red LIVE badges, an info bar over the video showing the REAL now/next programme from the EPG, and a bottom now-playing bar with channel name and progress.
            - Movies/Series: header with count badge and search, category chips, wide landscape poster tiles (gradient tile + title + year/genre badge, real covers fade in when available), and a bottom navigation bar with the Z logo.
            - All data stays real and dynamic from your playlist — no hard-coded channels, scores or counts.
            The player contains no channels — use your own legal IPTV playlist/subscription.
          files: |
            installer/ZaghlolPlayer-Setup-2.0.3.exe
            publish/ZaghlolPlayer.exe
          fail_on_unmatched_files: true
