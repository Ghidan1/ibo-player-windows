name: Build Zaghlol Player EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ZaghlolPlayer.csproj

      - name: Build
        run: dotnet build ZaghlolPlayer.csproj -c Release --no-restore

      - name: Publish single-file EXE
        run: dotnet publish ZaghlolPlayer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "iscc" }
          & $iscc ZaghlolPlayer.iss

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ZaghlolPlayer-exe
          path: publish/ZaghlolPlayer.exe
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ZaghlolPlayer-installer
          path: installer/ZaghlolPlayer-Setup-2.0.1.exe
          if-no-files-found: error

      - name: Publish release v2.0.1
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.1
          name: Zaghlol Player v2.0.1
          body: |
            Zaghlol Player v2.0.1 for Windows — fixes real-subscription login:
            - M3U links: real error messages (HTTP status / timeout / server closed the connection) instead of a generic failure, browser-like User-Agent, gzip support, 60s download timeout, playlist-shape check.
            - Xtream Codes: login can no longer get stuck on "loading" — 25s global timeout, catalogue loads in parallel, detailed auth errors (wrong credentials / expired / server unreachable), live seconds counter, button always re-enabled.
            - New "Test connection" button on the login screen reports exactly what the server answered.
            - M3U channels now always appear: group-title matching is canonical (case/space-insensitive), #EXTGRP and CR-only playlists supported, sidebar counts are computed from the loaded channel list, orphan channels get an "أخرى" bucket, and login shows the real channel/category counts (plus a clear message if a playlist arrives empty).
            - Progress bar: fills left-to-right in the Arabic RTL interface; position/duration is clamped and never shows a bogus "35:47 / 9:20" for live-style streams.
            - Categories keep the playlist's own order (الكل first), instead of alphabetical sorting.
            The player contains no channels — use your own legal IPTV playlist/subscription.
          files: |
            installer/ZaghlolPlayer-Setup-2.0.1.exe
            publish/ZaghlolPlayer.exe
          fail_on_unmatched_files: true
