name: Build Zaghlol Player EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ZaghlolPlayer.csproj

      - name: Build
        run: dotnet build ZaghlolPlayer.csproj -c Release --no-restore

      - name: Publish single-file EXE
        run: dotnet publish ZaghlolPlayer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "iscc" }
          & $iscc ZaghlolPlayer.iss

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ZaghlolPlayer-exe
          path: publish/ZaghlolPlayer.exe
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ZaghlolPlayer-installer
          path: installer/ZaghlolPlayer-Setup-2.0.exe
          if-no-files-found: error

      - name: Publish release v2.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: Zaghlol Player v2.0
          body: |
            Zaghlol Player v2.0 for Windows — modern IPTV player with a new dark TV-style interface (M3U / Xtream Codes / MAC login, Live TV, Movies, Series, 7-day EPG, multi-screen, PIN lock, 6 themes, demo channels).
            The player contains no channels — use your own legal IPTV playlist/subscription.
          files: |
            installer/ZaghlolPlayer-Setup-2.0.exe
            publish/ZaghlolPlayer.exe
          fail_on_unmatched_files: true
