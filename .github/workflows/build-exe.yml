name: Build IBO Player EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore IBOPlayer.csproj

      - name: Build
        run: dotnet build IBOPlayer.csproj -c Release --no-restore

      - name: Publish single-file EXE
        run: dotnet publish IBOPlayer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "iscc" }
          & $iscc IBOPlayer.iss

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: IBOPlayer-exe
          path: publish/IBOPlayer.exe
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: IBOPlayer-installer
          path: installer/IBOPlayer-Setup-1.0.exe
          if-no-files-found: error

      - name: Publish release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: IBO Player v1.0
          body: |
            IBO Player v1.0 for Windows — IPTV player (M3U / Xtream Codes / MAC login, Live TV, Movies, Series, 7-day EPG, multi-screen, PIN lock, 6 themes, demo channels).
            The player contains no channels — use your own legal IPTV playlist/subscription.
          files: |
            installer/IBOPlayer-Setup-1.0.exe
            publish/IBOPlayer.exe
          fail_on_unmatched_files: true
