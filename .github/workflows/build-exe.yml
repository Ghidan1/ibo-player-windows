name: Build Zaghlol Player EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore ZaghlolPlayer.csproj

      - name: Build
        run: dotnet build ZaghlolPlayer.csproj -c Release --no-restore

      - name: Publish single-file EXE
        run: dotnet publish ZaghlolPlayer.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "iscc" }
          & $iscc ZaghlolPlayer.iss

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ZaghlolPlayer-exe
          path: publish/ZaghlolPlayer.exe
          if-no-files-found: error

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ZaghlolPlayer-installer
          path: installer/ZaghlolPlayer-Setup-2.0.2.exe
          if-no-files-found: error

      - name: Publish release v2.0.2
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.2
          name: Zaghlol Player v2.0.2
          body: |
            Zaghlol Player v2.0.2 for Windows — movie/series posters + true fullscreen:
            - Posters are never blank anymore: every movie/series card is now a designed gradient tile (colour from the title) with a big monogram and the full title on it; a real cover fades in on top when it loads, and a failed cover simply falls back to the tile. Loading shimmer while covers fetch, no-referrer image loading, and the detail screen uses the same tile instead of an empty image box.
            - M3U playlists now fill the Movies and Series tabs too: VOD (.mp4/.mkv/...) entries become movies and S01E02 / Season / الحلقة entries become series with seasons and episodes (previously everything from M3U landed in Live TV only).
            - True fullscreen: the window itself goes borderless over the full screen so the Windows taskbar is hidden; Esc, the fullscreen button, or double-click restores the window exactly.
            The player contains no channels — use your own legal IPTV playlist/subscription.
          files: |
            installer/ZaghlolPlayer-Setup-2.0.2.exe
            publish/ZaghlolPlayer.exe
          fail_on_unmatched_files: true
